<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Target Shooting Game</title>
<style>
body {
  margin: 0;
  text-align: center;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
}
h1 { color: #38bdf8; }
canvas {
  background: #dbeafe;
  width: 95%;
  max-width: 500px;
  border: 3px solid white;
  border-radius: 12px;
  touch-action: manipulation;
}
button {
  padding: 14px 25px;
  font-size: 18px;
  margin: 10px;
  border: 0;
  border-radius: 10px;
  background: #22c55e;
  color: white;
}
</style>
</head>
<body>

<h1>🎯 টার্গেট শুটিং</h1>
<p>স্কোর: <span id="score">0</span> |
সময়: <span id="time">30</span> সেকেন্ড</p>

<canvas id="game" width="400" height="500"></canvas>
<br>
<button onclick="startGame()">গেম শুরু</button>
<p>টার্গেটে টাচ করে গুলি করো!</p>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");
let score = 0, time = 30, active = false;
let x = 200, y = 200, timer;

function draw() {
  ctx.clearRect(0, 0, 400, 500);
  ctx.fillStyle = "#bfdbfe";
  ctx.fillRect(0, 0, 400, 500);

  for (let r of [45, 32, 19, 7]) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = r === 45 ? "red" :
                    r === 32 ? "white" :
                    r === 19 ? "red" : "yellow";
    ctx.fill();
  }
}

function startGame() {
  clearInterval(timer);
  score = 0;
  time = 30;
  active = true;
  document.getElementById("score").textContent = score;
  document.getElementById("time").textContent = time;
  moveTarget();
  draw();

  timer = setInterval(() => {
    time--;
    document.getElementById("time").textContent = time;
    if (time <= 0) {
      clearInterval(timer);
      active = false;
      alert("গেম শেষ! তোমার স্কোর: " + score);
    }
  }, 1000);
}

function moveTarget() {
  x = 50 + Math.random() * 300;
  y = 60 + Math.random() * 380;
  draw();
}

c.addEventListener("pointerdown", (e) => {
  if (!active) return;
  const rect = c.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * 400 / rect.width;
  const my = (e.clientY - rect.top) * 500 / rect.height;
  if (Math.hypot(mx - x, my - y) < 45) {
    score += 10;
    document.getElementById("score").textContent = score;
    moveTarget();
  }
});

draw();
</script>
</body>
</html>
