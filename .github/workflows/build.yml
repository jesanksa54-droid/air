name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Project Files
        run: |
          mkdir -p app/src/main/java/com/example/applocker
          
          echo 'include ":app"' > settings.gradle
          echo 'buildscript { repositories { google(); mavenCentral() }; dependencies { classpath "com.android.tools.build:gradle:8.1.4" } }; allprojects { repositories { google(); mavenCentral() } }' > build.gradle
          
          echo 'plugins { id "com.android.application" }; android { namespace "com.example.applocker"; compileSdk 33; defaultConfig { applicationId "com.example.applocker"; minSdk 24; targetSdk 33; versionCode 1; versionName "1.0" } }' > app/build.gradle
          
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="App Locker"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          
          echo 'package com.example.applocker; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; public class MainActivity extends Activity { @Override protected void onCreate(Bundle b) { super.onCreate(b); TextView tv = new TextView(this); tv.setText("App Locker সফলভাবে তৈরি হয়েছে!"); setContentView(tv); } }' > app/src/main/java/com/example/applocker/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
